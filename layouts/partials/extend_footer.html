<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Find all code blocks generated by Hugo with the class 'language-mermaid'
    const mermaidBlocks = document.querySelectorAll("code.language-mermaid, pre.language-mermaid, div.highlight .language-mermaid");
    
    mermaidBlocks.forEach((block, index) => {
      // Create a clean div element for Mermaid to target
      const container = document.createElement("div");
      container.className = "mermaid";
      container.textContent = block.textContent;
      
      // Replace the default pre/code element with our mermaid div
      const parent = block.closest("div.highlight") || block.parentElement;
      parent.parentNode.replaceChild(container, parent);
    });

    // Initialize Mermaid rendering
    mermaid.initialize({ startOnLoad: true, theme: 'dark' });
  });
</script>
